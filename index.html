<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Mes Envies</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mes Envies">
<style>
* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
    "SF Pro Text", "Segoe UI", sans-serif;
  color: #111827;
  background:
    radial-gradient(circle at 15% 10%, rgba(255,255,255,.95) 0, transparent 28%),
    radial-gradient(circle at 85% 20%, rgba(130,170,255,.55) 0, transparent 30%),
    radial-gradient(circle at 50% 100%, rgba(180,140,255,.45) 0, transparent 35%),
    linear-gradient(135deg, #dcecff, #b9d3ff 45%, #d9c8ff);
  background-attachment: fixed;
}

/* Effet général de verre */

header,
main {
  position: relative;
}

header {
  padding: 24px 18px 18px;
  background: rgba(255,255,255,.25);
  backdrop-filter: blur(25px) saturate(160%);
  -webkit-backdrop-filter: blur(25px) saturate(160%);
  border-bottom: 1px solid rgba(255,255,255,.45);
  box-shadow: 0 8px 30px rgba(50,80,140,.12);
}

h1 {
  margin: 0;
  font-size: 30px;
  font-weight: 750;
  letter-spacing: -0.8px;
}

.sub {
  color: rgba(30,45,75,.65);
  margin-top: 5px;
  font-size: 14px;
}

main {
  padding: 18px 16px 40px;
  max-width: 760px;
  margin: auto;
}

/* Barre de recherche */

.bar {
  display: flex;
  gap: 9px;
  margin-bottom: 14px;
}

input,
select,
button {
  font: inherit;
  border: 0;
  border-radius: 15px;
  padding: 12px 14px;
}

input,
select {
  background: rgba(255,255,255,.48);
  color: #111827;
  border: 1px solid rgba(255,255,255,.7);
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,.8),
    0 5px 18px rgba(50,80,140,.08);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  outline: none;
}

input:focus,
select:focus {
  box-shadow:
    0 0 0 3px rgba(80,130,255,.18),
    inset 0 1px 1px rgba(255,255,255,.9);
}

input::placeholder {
  color: rgba(40,55,85,.5);
}

input[type="number"] {
  min-width: 0;
}

input[style] {
  background: rgba(255,255,255,.48) !important;
}

/* Boutons */

button {
  background: linear-gradient(
    135deg,
    rgba(255,255,255,.9),
    rgba(225,235,255,.65)
  );
  color: #17213a;
  font-weight: 650;
  border: 1px solid rgba(255,255,255,.8);
  box-shadow:
    0 6px 18px rgba(50,80,140,.14),
    inset 0 1px 1px rgba(255,255,255,.9);
  cursor: pointer;
  transition: transform .18s ease, box-shadow .18s ease;
}

button:hover {
  transform: translateY(-1px);
  box-shadow:
    0 9px 24px rgba(50,80,140,.18),
    inset 0 1px 1px rgba(255,255,255,1);
}

button:active {
  transform: scale(.97);
}

/* Filtres */

.filters {
  display: flex;
  gap: 8px;
  overflow: auto;
  margin-bottom: 16px;
}

.filters select {
  min-width: 145px;
}

/* Cartes produits */

.card {
  background: rgba(255,255,255,.38);
  border: 1px solid rgba(255,255,255,.65);
  border-radius: 22px;
  padding: 14px;
  margin: 11px 0;
  display: flex;
  gap: 14px;
  box-shadow:
    0 12px 35px rgba(50,80,140,.13),
    inset 0 1px 1px rgba(255,255,255,.8);
  backdrop-filter: blur(22px) saturate(140%);
  -webkit-backdrop-filter: blur(22px) saturate(140%);
}

.pic {
  width: 88px;
  height: 88px;
  flex-shrink: 0;
  border-radius: 17px;
  background: rgba(255,255,255,.5);
  object-fit: cover;
  border: 1px solid rgba(255,255,255,.65);
}

.info {
  flex: 1;
  min-width: 0;
}

.name {
  font-weight: 750;
  font-size: 17px;
  letter-spacing: -.2px;
}

.price {
  font-size: 18px;
  font-weight: 750;
  margin-top: 3px;
}

.desc {
  margin-top: 5px;
  color: rgba(30,45,75,.65);
  font-size: 14px;
}

.tag {
  display: inline-block;
  margin-top: 8px;
  padding: 5px 9px;
  border-radius: 999px;
  background: rgba(255,255,255,.48);
  border: 1px solid rgba(255,255,255,.6);
  font-size: 12px;
  color: rgba(30,45,75,.75);
}

/* État vide */

.empty {
  text-align: center;
  color: rgba(40,55,85,.65);
  padding: 60px 20px;
  background: rgba(255,255,255,.3);
  border: 1px solid rgba(255,255,255,.55);
  border-radius: 24px;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}

/* Fenêtre Ajouter */

dialog {
  border: 1px solid rgba(255,255,255,.75);
  border-radius: 26px;
  width: min(92%, 540px);
  padding: 20px;
  background: rgba(240,247,255,.62);
  color: #111827;
  box-shadow:
    0 30px 80px rgba(30,50,100,.3),
    inset 0 1px 1px rgba(255,255,255,.95);
  backdrop-filter: blur(35px) saturate(150%);
  -webkit-backdrop-filter: blur(35px) saturate(150%);
}

dialog::backdrop {
  background: rgba(25,40,75,.28);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.form {
  display: grid;
  gap: 10px;
}

.form input,
.form select {
  width: 100%;
}

.row {
  display: flex;
  gap: 8px;
}

.row > * {
  flex: 1;
}

a {
  color: inherit;
  text-decoration: none;
}

/* Petit effet lumineux */

header::before,
dialog::before,
.card::before {
  content: "";
  position: absolute;
  pointer-events: none;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(
    120deg,
    rgba(255,255,255,.45),
    transparent 35%,
    transparent 70%,
    rgba(255,255,255,.12)
  );
  opacity: .7;
}

.card {
  position: relative;
  overflow: hidden;
}

@media (max-width: 600px) {

  header {
    padding: 20px 15px 15px;
  }

  h1 {
    font-size: 27px;
  }

  main {
    padding: 14px 12px 30px;
  }

  .bar {
    flex-wrap: wrap;
  }

  .bar input {
    width: 100%;
    flex: 1 0 100%;
  }

  .bar button {
    flex: 1;
  }

  .card {
    padding: 12px;
    border-radius: 20px;
  }

  .pic {
    width: 75px;
    height: 75px;
  }

  dialog {
    width: calc(100% - 24px);
    padding: 17px;
  }
}
</style>  
</head>
<body>
<header><h1>Mes Envies</h1><div class="sub" id="summary">0 produit</div></header>
<main>
<div class="bar">
  <input id="search" placeholder="Rechercher un produit...">
  <button onclick="pasteLink()">Ajouter un lien</button>
  <button onclick="openForm()">+</button>
</div>
<div class="filters">
<select id="catFilter" onchange="render()"><option value="">Toutes les catégories</option></select>
<select id="sort" onchange="render()"><option value="new">Plus récents</option><option value="low">Prix croissant</option><option value="high">Prix décroissant</option></select>
</div>
<section id="list"></section>
</main>

<dialog id="dlg">
<h2>Ajouter un produit</h2>
<div class="form">
<div style="display:flex;gap:8px">
  <input id="url" placeholder="URL de la page produit" style="flex:1">
  <button type="button" onclick="pasteFromClipboard()">Coller</button>
</div>

<button type="button" onclick="getProductInfo()" style="margin-top:8px;width:100%">
  Récupérer les informations
</button>
<input id="name" placeholder="Nom du produit">
<div class="row"><input id="price" type="number" step="0.01" placeholder="Prix (€)"><select id="cat"><option>Autres</option><option>Électronique</option><option>Vêtements</option><option>Sport</option><option>Maison</option><option>Beauté</option></select></div>
<input id="image" placeholder="URL de l'image (optionnel)">
<input id="desc" placeholder="Petite description">
<div class="row"><button onclick="save()">Ajouter</button><button onclick="dlg.close()" style="background:#e5e7eb;color:#111827">Annuler</button></div>
</div>
</dialog>

<script>
const KEY="mes-envies-v1";
let products=JSON.parse(localStorage.getItem(KEY)||"[]");
const $=id=>document.getElementById(id);
function pasteLink(){
  openForm();
  $("url").focus();
}
async function pasteFromClipboard(){
  try {
    const text = await navigator.clipboard.readText();

    if (!text || !/^https?:\/\//i.test(text.trim())) {
      alert("Le presse-papiers ne contient pas de lien valide.");
      return;
    }

    $("url").value = text.trim();
  } catch(e) {
    alert("Autorise l'accès au presse-papiers ou colle le lien manuellement.");
  }
}
async function getProductInfo(){
  const url = $("url").value.trim();

  if(!url){
    alert("Colle d'abord l'URL du produit.");
    return;
  }

  try {
    const response = await fetch(
      "https://api.microlink.io/?url=" + encodeURIComponent(url)
    );

    if(!response.ok) {
      throw new Error("Erreur API");
    }

    const result = await response.json();
    const data = result.data || {};

    const title = data.title || data.metadata?.title || "";
    const image = data.image?.url || data.metadata?.image?.url || "";

    let found = false;

    if(title) {
      $("name").value = title;
      found = true;
    }

    if(image) {
      $("image").value = image;
      found = true;
    }

    if(found) {
      alert("Informations récupérées !");
    } else {
      alert("Le site ne fournit pas d'informations récupérables automatiquement.");
    }

  } catch(error) {
    console.error(error);
    alert("Impossible de récupérer les informations de ce site.");
  }
}
function openForm(){dlg.showModal()}
function save(){
 const p={id:Date.now(),url:$("url").value.trim(),name:$("name").value.trim()||"Produit sans nom",
 price:Number($("price").value)||0,cat:$("cat").value,image:$("image").value.trim(),
 desc:$("desc").value.trim(),date:Date.now()};
 if(!p.url){alert("Ajoute au moins l'URL du produit.");return}
 products.unshift(p);localStorage.setItem(KEY,JSON.stringify(products));dlg.close();
 ["url","name","price","image","desc"].forEach(x=>$(x).value="");render();
}
function render(){
 const q=$("search").value.toLowerCase(), cat=$("catFilter").value, sort=$("sort").value;
 let a=products.filter(p=>(!cat||p.cat===cat)&&(!q||(p.name+" "+p.desc).toLowerCase().includes(q)));
 if(sort==="low")a.sort((x,y)=>x.price-y.price); if(sort==="high")a.sort((x,y)=>y.price-x.price);
 $("summary").textContent=`${products.length} produit${products.length>1?"s":""} · ${products.reduce((s,p)=>s+p.price,0).toFixed(2)} €`;
 $("list").innerHTML=a.length?a.map(p=>`<article class="card">
 ${p.image?`<img class="pic" src="${esc(p.image)}">`:`<div class="pic"></div>`}
 <div class="info"><div class="name">${esc(p.name)}</div><div class="price">${p.price.toFixed(2)} €</div>
 <div class="desc">${esc(p.desc||"Aucune description")}</div><span class="tag">${esc(p.cat)}</span>
 <div style="margin-top:9px"><a href="${esc(p.url)}" target="_blank"><button>Voir le produit</button></a>
 <button onclick="del(${p.id})" style="background:#eee;color:#111;margin-left:5px">Supprimer</button></div></div></article>`).join("")
 :`<div class="empty">Aucun produit.<br><br>Appuie sur <b>＋</b> pour ajouter ta première envie.</div>`;
 let cats=[...new Set(products.map(p=>p.cat))];$("catFilter").innerHTML='<option value="">Toutes les catégories</option>'+cats.map(c=>`<option>${esc(c)}</option>`).join("");
}
function del(id){products=products.filter(p=>p.id!==id);localStorage.setItem(KEY,JSON.stringify(products));render()}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
$("search").addEventListener("input",render);render();
</script>
 
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js");
  });
}
</script>
</body></html>
