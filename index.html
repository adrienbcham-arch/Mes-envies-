<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Mes Envies</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mes Envies">
<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html {
  min-height: 100%;
  background: #f2f2f7;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text",
    "SF Pro Display", "Helvetica Neue", sans-serif;
  color: #000;
  background: #f2f2f7;
  -webkit-font-smoothing: antialiased;
}

/* HEADER iOS */

header {
  padding: 18px 20px 12px;
  background: #f2f2f7;
  border-bottom: 0;
}

h1 {
  margin: 0;
  font-size: 34px;
  line-height: 1.1;
  font-weight: 700;
  letter-spacing: -1.1px;
}

.sub {
  margin-top: 6px;
  color: #8e8e93;
  font-size: 15px;
}

/* CONTENU */

main {
  padding: 8px 16px 100px;
  max-width: 760px;
  margin: auto;
}

/* BARRE DE RECHERCHE */

.bar {
  display: flex;
  gap: 8px;
  margin: 4px 0 16px;
}

.bar input {
  flex: 1;
  min-width: 0;
}

input,
select,
button {
  font: inherit;
}

input,
select {
  border: 0;
  outline: none;
  border-radius: 11px;
  padding: 11px 13px;
  background: #e5e5ea;
  color: #000;
  font-size: 16px;
}

input::placeholder {
  color: #8e8e93;
}

input:focus,
select:focus {
  background: #dedee3;
}

input[type="number"] {
  min-width: 0;
}

/* BOUTONS */

button {
  border: 0;
  border-radius: 11px;
  padding: 11px 15px;
  background: #007aff;
  color: white;
  font-weight: 600;
  font-size: 16px;
  cursor: pointer;
  transition: opacity .15s ease, transform .1s ease;
}

button:active {
  opacity: .65;
  transform: scale(.98);
}

/* FILTRES */

.filters {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  margin: 0 -16px 16px;
  padding: 0 16px 2px;
  scrollbar-width: none;
}

.filters::-webkit-scrollbar {
  display: none;
}

.filters select {
  min-width: 145px;
  background: #e5e5ea;
}

/* LISTE DES PRODUITS */

.card {
  position: relative;
  display: flex;
  gap: 14px;
  margin: 0;
  padding: 14px 4px;
  background: transparent;
  border: 0;
  border-radius: 0;
  box-shadow: none;
  overflow: visible;
}

.card + .card {
  border-top: 1px solid #d1d1d6;
}

.pic {
  width: 92px;
  height: 92px;
  flex: 0 0 92px;
  border-radius: 12px;
  background: #e5e5ea;
  object-fit: cover;
  border: 0;
}

.info {
  flex: 1;
  min-width: 0;
}

.name {
  font-size: 17px;
  line-height: 1.25;
  font-weight: 600;
  color: #000;
}

.price {
  margin-top: 4px;
  font-size: 17px;
  font-weight: 600;
  color: #000;
}

.desc {
  margin-top: 5px;
  color: #8e8e93;
  font-size: 15px;
  line-height: 1.25;
}

.tag {
  display: inline-block;
  margin-top: 8px;
  padding: 4px 8px;
  border-radius: 7px;
  background: #e5e5ea;
  color: #636366;
  font-size: 12px;
  font-weight: 500;
}

/* BOUTONS DES CARTES */

.card button {
  margin-top: 8px;
  padding: 7px 10px;
  font-size: 14px;
  border-radius: 8px;
}

.card button[style] {
  background: #e5e5ea !important;
  color: #000 !important;
}

/* ÉTAT VIDE */

.empty {
  margin-top: 20px;
  padding: 55px 20px;
  text-align: center;
  color: #8e8e93;
  font-size: 15px;
  background: transparent;
  border: 0;
  border-radius: 0;
}

/* FENÊTRE D'AJOUT */

dialog {
  width: min(92%, 540px);
  margin: auto;
  padding: 20px;
  border: 0;
  border-radius: 20px;
  background: #f2f2f7;
  color: #000;
  box-shadow: 0 20px 60px rgba(0,0,0,.25);
}

dialog::backdrop {
  background: rgba(0,0,0,.35);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.form {
  display: grid;
  gap: 10px;
}

.form input,
.form select {
  width: 100%;
}

.row {
  display: flex;
  gap: 8px;
}

.row > * {
  flex: 1;
}

a {
  color: inherit;
  text-decoration: none;
}

/* CHAMP URL + BOUTON COLLER */

#url {
  min-width: 0;
}

/* MOBILE */

@media (max-width: 600px) {

  header {
    padding: 20px 20px 12px;
  }

  h1 {
    font-size: 34px;
  }

  main {
    padding: 8px 16px 100px;
  }

  .bar {
    flex-wrap: nowrap;
  }

  .bar input {
    width: auto;
  }

  .bar button {
    flex-shrink: 0;
  }

  .card {
    padding: 14px 2px;
  }

  .pic {
    width: 82px;
    height: 82px;
    flex-basis: 82px;
  }

  dialog {
    width: calc(100% - 28px);
    padding: 18px;
  }
}

/* MODE SOMBRE iOS */

@media (prefers-color-scheme: dark) {

  html,
  body,
  header {
    background: #000;
    color: #fff;
  }

  input,
  select {
    background: #1c1c1e;
    color: #fff;
  }

  input::placeholder {
    color: #8e8e93;
  }

  .filters select {
    background: #1c1c1e;
  }

  .name,
  .price {
    color: #fff;
  }

  .desc {
    color: #98989d;
  }

  .tag {
    background: #1c1c1e;
    color: #98989d;
  }

  .card + .card {
    border-color: #38383a;
  }

  .pic {
    background: #1c1c1e;
  }

  .empty {
    color: #98989d;
  }

  dialog {
    background: #1c1c1e;
    color: #fff;
  }

  .card button[style] {
    background: #2c2c2e !important;
    color: #fff !important;
  }
}
/* BARRE DE NAVIGATION STYLE iOS */

.ios-tabbar {
  position: fixed;
  z-index: 1000;
  left: 0;
  right: 0;
  bottom: 0;

  height: calc(70px + env(safe-area-inset-bottom));

  display: flex;
  justify-content: space-around;
  align-items: flex-start;

  padding: 8px 8px env(safe-area-inset-bottom);

  background: rgba(249,249,249,.88);
  border-top: 1px solid rgba(60,60,67,.18);

  backdrop-filter: blur(25px) saturate(180%);
  -webkit-backdrop-filter: blur(25px) saturate(180%);

  box-shadow: 0 -5px 20px rgba(0,0,0,.05);
}

.tab {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;

  gap: 3px;

  min-width: 70px;
  padding: 2px 8px;

  background: transparent;
  border: 0;
  box-shadow: none;

  color: #8e8e93;
  font-size: 10px;
  font-weight: 500;
}

.tab:hover {
  transform: none;
  box-shadow: none;
}

.tab:active {
  transform: scale(.92);
}

.tab.active {
  color: #007aff;
}

.tab-icon {
  font-size: 25px;
  line-height: 27px;
  font-weight: 400;
}

.add-tab {
  color: #007aff;
}

.add-circle {
  width: 29px;
  height: 29px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;

  background: #007aff;
  color: white;

  font-size: 23px;
  line-height: 29px;

  box-shadow: 0 2px 6px rgba(0,122,255,.3);
}

@media (prefers-color-scheme: dark) {

  .ios-tabbar {
    background: rgba(28,28,30,.9);
    border-color: rgba(255,255,255,.15);
  }

  .tab {
    color: #8e8e93;
  }

  .tab.active,
  .add-tab {
    color: #0a84ff;
  }

  .add-circle {
    background: #0a84ff;
  }
}
</style>  
</head>
<body>
<header><h1>Mes Envies</h1><div class="sub" id="summary">0 produit</div></header>
<main>
<div class="bar">
  <input id="search" placeholder="Rechercher un produit...">
  <button onclick="pasteLink()">Ajouter un lien</button>
  <button onclick="openForm()">+</button>
</div>
<div class="filters">
<select id="catFilter" onchange="render()"><option value="">Toutes les catégories</option></select>
<select id="sort" onchange="render()"><option value="new">Plus récents</option><option value="low">Prix croissant</option><option value="high">Prix décroissant</option></select>
</div>
<section id="list"></section>
</main>

<dialog id="dlg">
<h2>Ajouter un produit</h2>
<div class="form">
<div style="display:flex;gap:8px">
  <input id="url" placeholder="URL de la page produit" style="flex:1">
  <button type="button" onclick="pasteFromClipboard()">Coller</button>
</div>

<button type="button" onclick="getProductInfo()" style="margin-top:8px;width:100%">
  Récupérer les informations
</button>
<input id="name" placeholder="Nom du produit">
<div class="row"><input id="price" type="number" step="0.01" placeholder="Prix (€)"><select id="cat"><option>Autres</option><option>Électronique</option><option>Vêtements</option><option>Sport</option><option>Maison</option><option>Beauté</option></select></div>
<input id="image" placeholder="URL de l'image (optionnel)">
<input id="desc" placeholder="Petite description">
<div class="row"><button onclick="save()">Ajouter</button><button onclick="dlg.close()" style="background:#e5e7eb;color:#111827">Annuler</button></div>
</div>
</dialog>

<script>
const KEY="mes-envies-v1";
let products=JSON.parse(localStorage.getItem(KEY)||"[]");
const $=id=>document.getElementById(id);
function pasteLink(){
  openForm();
  $("url").focus();
}
async function pasteFromClipboard(){
  try {
    const text = await navigator.clipboard.readText();

    if (!text || !/^https?:\/\//i.test(text.trim())) {
      alert("Le presse-papiers ne contient pas de lien valide.");
      return;
    }

    $("url").value = text.trim();
  } catch(e) {
    alert("Autorise l'accès au presse-papiers ou colle le lien manuellement.");
  }
}
async function getProductInfo(){
  const url = $("url").value.trim();

  if(!url){
    alert("Colle d'abord l'URL du produit.");
    return;
  }

  try {
    const response = await fetch(
      "https://api.microlink.io/?url=" + encodeURIComponent(url)
    );

    if(!response.ok) {
      throw new Error("Erreur API");
    }

    const result = await response.json();
    const data = result.data || {};

    const title = data.title || data.metadata?.title || "";
    const image = data.image?.url || data.metadata?.image?.url || "";

    let found = false;

    if(title) {
      $("name").value = title;
      found = true;
    }

    if(image) {
      $("image").value = image;
      found = true;
    }

    if(found) {
      alert("Informations récupérées !");
    } else {
      alert("Le site ne fournit pas d'informations récupérables automatiquement.");
    }

  } catch(error) {
    console.error(error);
    alert("Impossible de récupérer les informations de ce site.");
  }
}
function openForm(){dlg.showModal()}
function save(){
 const p={id:Date.now(),url:$("url").value.trim(),name:$("name").value.trim()||"Produit sans nom",
 price:Number($("price").value)||0,cat:$("cat").value,image:$("image").value.trim(),
 desc:$("desc").value.trim(),date:Date.now()};
 if(!p.url){alert("Ajoute au moins l'URL du produit.");return}
 products.unshift(p);localStorage.setItem(KEY,JSON.stringify(products));dlg.close();
 ["url","name","price","image","desc"].forEach(x=>$(x).value="");render();
}
function render(){
 const q=$("search").value.toLowerCase(), cat=$("catFilter").value, sort=$("sort").value;
 let a=products.filter(p=>(!cat||p.cat===cat)&&(!q||(p.name+" "+p.desc).toLowerCase().includes(q)));
 if(sort==="low")a.sort((x,y)=>x.price-y.price); if(sort==="high")a.sort((x,y)=>y.price-x.price);
 $("summary").textContent=`${products.length} produit${products.length>1?"s":""} · ${products.reduce((s,p)=>s+p.price,0).toFixed(2)} €`;
 $("list").innerHTML=a.length?a.map(p=>`<article class="card">
 ${p.image?`<img class="pic" src="${esc(p.image)}">`:`<div class="pic"></div>`}
 <div class="info"><div class="name">${esc(p.name)}</div><div class="price">${p.price.toFixed(2)} €</div>
 <div class="desc">${esc(p.desc||"Aucune description")}</div><span class="tag">${esc(p.cat)}</span>
 <div style="margin-top:9px"><a href="${esc(p.url)}" target="_blank"><button>Voir le produit</button></a>
 <button onclick="del(${p.id})" style="background:#eee;color:#111;margin-left:5px">Supprimer</button></div></div></article>`).join("")
 :`<div class="empty">Aucun produit.<br><br>Appuie sur <b>＋</b> pour ajouter ta première envie.</div>`;
 let cats=[...new Set(products.map(p=>p.cat))];$("catFilter").innerHTML='<option value="">Toutes les catégories</option>'+cats.map(c=>`<option>${esc(c)}</option>`).join("");
}
function del(id){products=products.filter(p=>p.id!==id);localStorage.setItem(KEY,JSON.stringify(products));render()}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
$("search").addEventListener("input",render);render();
</script>
 
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js");
  });
}
</script>
<nav class="ios-tabbar">
  <button class="tab active" onclick="window.scrollTo({top:0,behavior:'smooth'})">
    <span class="tab-icon">⌂</span>
    <span>Accueil</span>
  </button>

  <button class="tab" onclick="document.getElementById('search').focus()">
    <span class="tab-icon">⌕</span>
    <span>Rechercher</span>
  </button>

  <button class="tab add-tab" onclick="openForm()">
    <span class="add-circle">＋</span>
    <span>Ajouter</span>
  </button>

  <button class="tab" onclick="window.scrollTo({top:0,behavior:'smooth'})">
    <span class="tab-icon">♡</span>
    <span>Envies</span>
  </button>
</nav>
</body>
</html>
