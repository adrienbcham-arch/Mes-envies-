<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Mes Envies</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mes Envies">
<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html {
  min-height: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  padding-bottom: 105px;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    "Helvetica Neue",
    sans-serif;

  color: #111;
  background: #ffffff;

  -webkit-font-smoothing: antialiased;
}

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    "Helvetica Neue",
    sans-serif;

  color: #111;
  background: #ffffff;

  -webkit-font-smoothing: antialiased;
}
  margin: 0;
  min-height: 100vh;
  padding-bottom: 105px;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    "Helvetica Neue",
    sans-serif;

  color: #111;
  -webkit-font-smoothing: antialiased;

  background:
    radial-gradient(
      circle at 20% 0%,
      rgba(255,255,255,.95) 0%,
      transparent 32%
    ),
    radial-gradient(
      circle at 90% 20%,
      rgba(150,190,255,.55) 0%,
      transparent 30%
    ),
    radial-gradient(
      circle at 30% 90%,
      rgba(190,160,255,.45) 0%,
      transparent 35%
    ),
    linear-gradient(
      135deg,
      #dceaff,
      #c9dcff 45%,
      #e3d8ff
    );

  background-attachment: fixed;
}

/* =====================================================
   HEADER — BULLE FLOTTANTE
===================================================== */

header {
  position: relative;
  margin: 14px 14px 10px;
  padding: 22px 20px 19px;

  border-radius: 30px;

  background: rgba(255,255,255,.42);
  border: 1px solid rgba(255,255,255,.72);

  backdrop-filter: blur(30px) saturate(180%);
  -webkit-backdrop-filter: blur(30px) saturate(180%);

  box-shadow:
    0 14px 40px rgba(45,70,120,.14),
    inset 0 1px 1px rgba(255,255,255,.95);

  overflow: hidden;
}

header::before {
  content: "";
  position: absolute;
  inset: 0;

  background:
    linear-gradient(
      120deg,
      rgba(255,255,255,.65),
      transparent 38%,
      transparent 70%,
      rgba(255,255,255,.2)
    );

  pointer-events: none;
}

h1 {
  position: relative;
  margin: 0;

  font-size: 34px;
  line-height: 1.1;
  font-weight: 750;
  letter-spacing: -1.2px;
}

.sub {
  position: relative;
  margin-top: 6px;

  color: rgba(40,50,75,.58);
  font-size: 15px;
  font-weight: 500;
}

/* =====================================================
   CONTENU
===================================================== */

main {
  position: relative;

  padding: 8px 16px 30px;
  max-width: 760px;
  margin: auto;
}

/* =====================================================
   BARRE DE RECHERCHE
===================================================== */

.bar {
  display: flex;
  gap: 9px;
  margin-bottom: 15px;
}

/* =====================================================
   TOUS LES CHAMPS
===================================================== */

input,
select {
  font: inherit;

  border: 1px solid rgba(255,255,255,.7);
  border-radius: 18px;

  padding: 13px 15px;

  background: rgba(255,255,255,.48);

  color: #111;

  outline: none;

  backdrop-filter: blur(20px) saturate(160%);
  -webkit-backdrop-filter: blur(20px) saturate(160%);

  box-shadow:
    0 7px 22px rgba(40,65,110,.09),
    inset 0 1px 1px rgba(255,255,255,.9);

  transition:
    transform .18s ease,
    box-shadow .18s ease,
    background .18s ease;
}

input:focus,
select:focus {
  background: rgba(255,255,255,.65);

  box-shadow:
    0 0 0 3px rgba(0,122,255,.14),
    0 10px 28px rgba(40,65,110,.12),
    inset 0 1px 1px rgba(255,255,255,1);
}

input::placeholder {
  color: rgba(40,45,60,.48);
}

/* =====================================================
   BOUTONS — PETITES BULLES
===================================================== */

button {
  font: inherit;

  border: 1px solid rgba(255,255,255,.7);
  border-radius: 18px;

  padding: 13px 17px;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.78),
      rgba(225,235,255,.55)
    );

  color: #111827;
  font-weight: 650;

  backdrop-filter: blur(20px) saturate(170%);
  -webkit-backdrop-filter: blur(20px) saturate(170%);

  box-shadow:
    0 8px 22px rgba(40,65,110,.13),
    inset 0 1px 1px rgba(255,255,255,.95);

  cursor: pointer;

  transition:
    transform .16s ease,
    box-shadow .16s ease;
}

button:hover {
  transform: translateY(-1px);

  box-shadow:
    0 11px 27px rgba(40,65,110,.17),
    inset 0 1px 1px rgba(255,255,255,1);
}

button:active {
  transform: scale(.95);
}

/* Bouton bleu principal */

.bar button {
  background:
    linear-gradient(
      135deg,
      #1684ff,
      #006eea
    );

  color: white;

  border: 1px solid rgba(255,255,255,.35);

  box-shadow:
    0 9px 24px rgba(0,100,220,.25),
    inset 0 1px 1px rgba(255,255,255,.35);
}

/* =====================================================
   FILTRES — BULLES FLOTTANTES
===================================================== */

.filters {
  display: flex;
  gap: 9px;

  overflow-x: auto;

  margin-bottom: 18px;

  scrollbar-width: none;
}

.filters::-webkit-scrollbar {
  display: none;
}

.filters select {
  min-width: 145px;
  flex-shrink: 0;
}

/* =====================================================
   CARTES PRODUITS — GROSSES BULLES
===================================================== */

.card {
  position: relative;
  overflow: hidden;

  display: flex;
  gap: 14px;

  margin: 13px 0;
  padding: 14px;

  border-radius: 26px;

  background: rgba(255,255,255,.42);

  border: 1px solid rgba(255,255,255,.7);

  backdrop-filter: blur(25px) saturate(165%);
  -webkit-backdrop-filter: blur(25px) saturate(165%);

  box-shadow:
    0 14px 38px rgba(40,65,110,.13),
    inset 0 1px 1px rgba(255,255,255,.9);

  transition:
    transform .18s ease,
    box-shadow .18s ease;
}

.card:hover {
  transform: translateY(-2px);

  box-shadow:
    0 18px 44px rgba(40,65,110,.17),
    inset 0 1px 1px rgba(255,255,255,1);
}

.card::before {
  content: "";

  position: absolute;
  inset: 0;

  background:
    linear-gradient(
      125deg,
      rgba(255,255,255,.5),
      transparent 35%,
      transparent 70%,
      rgba(255,255,255,.12)
    );

  pointer-events: none;
}

/* =====================================================
   IMAGE PRODUIT
===================================================== */

.pic {
  position: relative;

  width: 88px;
  height: 88px;

  flex-shrink: 0;

  border-radius: 20px;

  object-fit: cover;

  background: rgba(255,255,255,.48);

  border: 1px solid rgba(255,255,255,.65);

  box-shadow:
    0 5px 15px rgba(30,50,90,.1),
    inset 0 1px 1px rgba(255,255,255,.9);
}

/* =====================================================
   INFORMATIONS PRODUIT
===================================================== */

.info {
  position: relative;
  flex: 1;
  min-width: 0;
}

.name {
  font-weight: 750;
  font-size: 17px;
  letter-spacing: -.2px;
}

.price {
  margin-top: 3px;

  font-size: 18px;
  font-weight: 750;
}

.desc {
  margin-top: 5px;

  color: rgba(35,45,70,.62);

  font-size: 14px;
}

.tag {
  display: inline-block;

  margin-top: 8px;
  padding: 6px 10px;

  border-radius: 999px;

  background: rgba(255,255,255,.5);

  border: 1px solid rgba(255,255,255,.65);

  color: rgba(35,45,70,.7);

  font-size: 12px;

  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
}

/* =====================================================
   ÉCRAN VIDE — GRANDE BULLE
===================================================== */

.empty {
  margin-top: 30px;

  padding: 65px 20px;

  text-align: center;

  color: rgba(40,50,70,.58);

  border-radius: 28px;

  background: rgba(255,255,255,.32);

  border: 1px solid rgba(255,255,255,.58);

  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);

  box-shadow:
    0 12px 35px rgba(40,65,110,.08),
    inset 0 1px 1px rgba(255,255,255,.8);
}

/* =====================================================
   FENÊTRE AJOUTER — BULLE DE VERRE
===================================================== */

dialog {
  border: 1px solid rgba(255,255,255,.75);

  border-radius: 30px;

  width: min(92%, 540px);

  padding: 20px;

  background: rgba(235,243,255,.7);

  color: #111;

  backdrop-filter: blur(35px) saturate(180%);
  -webkit-backdrop-filter: blur(35px) saturate(180%);

  box-shadow:
    0 30px 90px rgba(25,45,90,.3),
    inset 0 1px 1px rgba(255,255,255,1);
}

dialog::backdrop {
  background: rgba(20,35,65,.28);

  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.form {
  display: grid;
  gap: 11px;
}

.form input,
.form select {
  width: 100%;
}

.row {
  display: flex;
  gap: 9px;
}

.row > * {
  flex: 1;
}

a {
  color: inherit;
  text-decoration: none;
}

/* =====================================================
   BARRE DU BAS — GRANDE BULLE FLOTTANTE
===================================================== */

.ios-tabbar {
  position: fixed;

  z-index: 1000;

  left: 14px;
  right: 14px;

  bottom: calc(10px + env(safe-area-inset-bottom));

  height: 76px;

  display: flex;
  align-items: center;
  justify-content: space-around;

  padding: 7px 10px;

  border-radius: 34px;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.62),
      rgba(245,248,255,.42)
    );

  border: 1px solid rgba(255,255,255,.8);

  backdrop-filter: blur(30px) saturate(190%);
  -webkit-backdrop-filter: blur(30px) saturate(190%);

  box-shadow:
    0 15px 45px rgba(35,55,100,.22),
    inset 0 1px 1px rgba(255,255,255,1);

  overflow: hidden;
}

.ios-tabbar::before {
  content: "";

  position: absolute;
  inset: 0;

  background:
    linear-gradient(
      115deg,
      rgba(255,255,255,.6),
      transparent 35%,
      transparent 65%,
      rgba(255,255,255,.18)
    );

  pointer-events: none;
}

.tab {
  position: relative;

  z-index: 1;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  gap: 2px;

  min-width: 65px;
  height: 60px;

  padding: 4px 8px;

  border: 0;

  background: transparent;

  color: rgba(40,45,55,.58);

  font-size: 10px;
  font-weight: 550;

  box-shadow: none;

  backdrop-filter: none;
}

.tab:hover {
  transform: none;
  box-shadow: none;
}

.tab:active {
  transform: scale(.9);
}

.tab {
  position: relative;
  z-index: 1;
}

.tab.active {
  color: #007aff;
}

/* Bulle de verre autour de l'élément sélectionné */

.tab.active::before {
  content: "";

  position: absolute;

  width: 58px;
  height: 58px;

  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);

  border-radius: 22px;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.72),
      rgba(235,242,255,.38)
    );

  border: 1px solid rgba(255,255,255,.9);

  backdrop-filter: blur(25px) saturate(180%);
  -webkit-backdrop-filter: blur(25px) saturate(180%);

  box-shadow:
    0 10px 28px rgba(30,55,100,.18),
    inset 0 1px 2px rgba(255,255,255,1),
    inset 0 -1px 1px rgba(255,255,255,.25);

  z-index: -1;

  animation: glassBubble .25s ease-out;
}

/* Reflet de la bulle */

.tab.active::after {
  content: "";

  position: absolute;

  width: 38px;
  height: 15px;

  top: 7px;
  left: 50%;

  transform: translateX(-50%);

  border-radius: 50%;

  background: rgba(255,255,255,.42);

  filter: blur(4px);

  pointer-events: none;
}

@keyframes glassBubble {
  from {
    opacity: 0;
    transform: translate(-50%, -50%) scale(.75);
  }

  to {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
}
}

.tab-icon {
  font-size: 26px;
  line-height: 29px;
  font-weight: 400;
}

/* =====================================================
   BOUTON + CENTRAL
===================================================== */

.add-tab {
  color: #007aff;
}

.add-circle {
  width: 42px;
  height: 42px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;

  background:
    linear-gradient(
      145deg,
      #2490ff,
      #006eea
    );

  color: white;

  font-size: 30px;
  line-height: 42px;

  border: 1px solid rgba(255,255,255,.45);

  box-shadow:
    0 7px 18px rgba(0,110,235,.32),
    inset 0 1px 1px rgba(255,255,255,.5);
}

/* =====================================================
   MODE SOMBRE
===================================================== */

@media (prefers-color-scheme: dark) {

  body {
    color: white;

    background:
      radial-gradient(
        circle at 20% 0%,
        rgba(80,100,140,.5),
        transparent 30%
      ),
      radial-gradient(
        circle at 90% 20%,
        rgba(50,80,150,.5),
        transparent 30%
      ),
      linear-gradient(
        135deg,
        #151a25,
        #20283a,
        #29233d
      );
  }

  header {
    background: rgba(40,45,55,.5);
    border-color: rgba(255,255,255,.12);
  }

  .sub,
  .desc {
    color: rgba(235,235,245,.58);
  }

  input,
  select {
    background: rgba(45,48,58,.55);
    color: white;
    border-color: rgba(255,255,255,.12);
  }

  input::placeholder {
    color: rgba(235,235,245,.4);
  }

  button {
    background: rgba(55,58,68,.65);
    color: white;
    border-color: rgba(255,255,255,.12);
  }

  .card {
    background: rgba(45,48,58,.5);
    border-color: rgba(255,255,255,.12);
  }

  .tag {
    background: rgba(255,255,255,.08);
    color: rgba(235,235,245,.7);
  }

  .empty {
    background: rgba(45,48,58,.4);
    border-color: rgba(255,255,255,.1);
  }

  dialog {
    background: rgba(35,40,52,.82);
    color: white;
  }

  .ios-tabbar {
    background: rgba(35,38,47,.72);
    border-color: rgba(255,255,255,.14);
  }

  .tab {
    color: rgba(235,235,245,.55);
  }

  .tab.active,
  .add-tab {
    color: #0a84ff;
  }
}

/* =====================================================
   IPHONE
===================================================== */

@media (max-width: 600px) {

  header {
    margin: 10px 12px 9px;
    padding: 20px 18px 17px;
    border-radius: 27px;
  }

  h1 {
    font-size: 30px;
  }

  main {
    padding: 7px 12px 25px;
  }

  .bar {
    flex-wrap: wrap;
  }

  .bar input {
    width: 100%;
    flex: 1 0 100%;
  }

  .bar button {
    flex: 1;
  }

  .card {
    border-radius: 23px;
    padding: 12px;
  }

  .pic {
    width: 75px;
    height: 75px;
    border-radius: 18px;
  }

  .ios-tabbar {
    left: 10px;
    right: 10px;
    bottom: calc(8px + env(safe-area-inset-bottom));
    height: 72px;
    border-radius: 32px;
  }

  .tab {
    min-width: 60px;
  }

  .tab-icon {
    font-size: 24px;
  }

  .add-circle {
    width: 40px;
    height: 40px;
  }

  dialog {
    width: calc(100% - 20px);
    padding: 17px;
    border-radius: 28px;
  }
}
/* ================================
   PAGES DE L'APPLICATION
================================ */

.app-page {
  display: none;
  animation: pageIn .22s ease-out;
}

.app-page.active-page {
  display: block;
}

.app-page h2 {
  margin: 12px 4px 18px;
  font-size: 28px;
  letter-spacing: -0.7px;
  font-weight: 750;
}

.section-title {
  margin-top: 28px !important;
}

/* ================================
   STATISTIQUES ACCUEIL
================================ */

.stats-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.glass-stat {
  position: relative;
  overflow: hidden;

  min-height: 105px;
  padding: 18px;

  display: flex;
  flex-direction: column;
  justify-content: space-between;

  border-radius: 25px;

  background: rgba(255,255,255,.48);
  border: 1px solid rgba(255,255,255,.75);

  backdrop-filter: blur(25px) saturate(170%);
  -webkit-backdrop-filter: blur(25px) saturate(170%);

  box-shadow:
    0 12px 30px rgba(40,65,110,.11),
    inset 0 1px 1px rgba(255,255,255,.95);
}

.glass-stat span {
  color: #8e8e93;
  font-size: 14px;
}

.glass-stat strong {
  font-size: 27px;
  letter-spacing: -1px;
}

/* ================================
   RECHERCHE
================================ */

.search-bubble {
  padding: 5px;

  border-radius: 22px;

  background: rgba(255,255,255,.42);
  border: 1px solid rgba(255,255,255,.7);

  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);

  box-shadow:
    0 10px 28px rgba(40,65,110,.1),
    inset 0 1px 1px rgba(255,255,255,.9);

  margin-bottom: 18px;
}

.search-bubble input {
  width: 100%;
  background: rgba(255,255,255,.38);
  box-shadow: none;
  border: 0;
}

/* ================================
   PAGE AJOUT
================================ */

.add-card {
  display: grid;
  gap: 11px;

  padding: 17px;

  border-radius: 28px;

  background: rgba(255,255,255,.45);
  border: 1px solid rgba(255,255,255,.75);

  backdrop-filter: blur(28px) saturate(170%);
  -webkit-backdrop-filter: blur(28px) saturate(170%);

  box-shadow:
    0 14px 38px rgba(40,65,110,.13),
    inset 0 1px 1px rgba(255,255,255,.95);
}

.add-card input,
.add-card select {
  width: 100%;
}

.main-add-button {
  margin-top: 5px;

  background: linear-gradient(
    135deg,
    #1684ff,
    #006eea
  );

  color: white;

  border: 1px solid rgba(255,255,255,.4);

  box-shadow:
    0 9px 24px rgba(0,110,235,.25);
}

/* ================================
   ANIMATION
================================ */

@keyframes pageIn {
  from {
    opacity: 0;
    transform: translateY(6px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* ================================
   MOBILE
================================ */

@media (max-width: 600px) {

  .app-page h2 {
    font-size: 28px;
    margin-top: 10px;
  }

  .stats-grid {
    grid-template-columns: 1fr 1fr;
  }

  .glass-stat {
    min-height: 100px;
    padding: 16px;
  }

  .glass-stat strong {
    font-size: 25px;
  }

  .add-card {
    padding: 15px;
    border-radius: 25px;
  }
}
</style>
</head>
<body>
<header><h1>Mes Envies</h1><div class="sub" id="summary">0 produit</div></header>
<main>
<section id="page-home" class="app-page active-page">
  <h2>Vue d’ensemble</h2>

  <div class="stats-grid">
    <div class="glass-stat">
      <span>Envies</span>
      <strong id="home-count">0</strong>
    </div>

    <div class="glass-stat">
      <span>Total</span>
      <strong id="home-total">0 €</strong>
    </div>

    <div class="glass-stat">
      <span>Catégories</span>
      <strong id="home-categories">0</strong>
    </div>
  </div>

  <h2 class="section-title">Dernières envies</h2>
  <div id="home-list"></div>
</section>

<section id="page-search" class="app-page">
  <h2>Recherche</h2>

  <div class="search-bubble">
    <input id="search-page" placeholder="Rechercher un produit">
  </div>

  <div id="search-list"></div>
</section>

<section id="page-add" class="app-page">
  <h2>Ajouter une envie</h2>

  <div class="add-card">
    <input id="page-url" placeholder="URL de la page produit">
    <input id="page-name" placeholder="Nom du produit">

    <div class="row">
      <input id="page-price" type="number" step="0.01" placeholder="Prix (€)">

      <select id="page-cat">
        <option>Autres</option>
        <option>Électronique</option>
        <option>Vêtements</option>
        <option>Sport</option>
        <option>Maison</option>
        <option>Beauté</option>
      </select>
    </div>

    <input id="page-image" placeholder="URL de l'image (optionnel)">
    <input id="page-desc" placeholder="Petite description">

    <button class="main-add-button" onclick="saveFromPage()">
      Ajouter à mes envies
    </button>
  </div>
</section>

<section id="page-favorites" class="app-page">
  <h2>Favoris</h2>
  <div id="favorites-list"></div>
</section>
<div class="bar">
  <input id="search" placeholder="Rechercher un produit...">
  <button onclick="pasteLink()">Ajouter un lien</button>
  <button onclick="openForm()">+</button>
</div>
<div class="filters">
<select id="catFilter" onchange="render()"><option value="">Toutes les catégories</option></select>
<select id="sort" onchange="render()"><option value="new">Plus récents</option><option value="low">Prix croissant</option><option value="high">Prix décroissant</option></select>
</div>
<section id="list"></section>
</main>

<dialog id="dlg">
<h2>Ajouter un produit</h2>
<div class="form">
<div style="display:flex;gap:8px">
  <input id="url" placeholder="URL de la page produit" style="flex:1">
  <button type="button" onclick="pasteFromClipboard()">Coller</button>
</div>

<button type="button" onclick="getProductInfo()" style="margin-top:8px;width:100%">
  Récupérer les informations
</button>
<input id="name" placeholder="Nom du produit">
<div class="row"><input id="price" type="number" step="0.01" placeholder="Prix (€)"><select id="cat"><option>Autres</option><option>Électronique</option><option>Vêtements</option><option>Sport</option><option>Maison</option><option>Beauté</option></select></div>
<input id="image" placeholder="URL de l'image (optionnel)">
<input id="desc" placeholder="Petite description">
<div class="row"><button onclick="save()">Ajouter</button><button onclick="dlg.close()" style="background:#e5e7eb;color:#111827">Annuler</button></div>
</div>
</dialog>

<script>
const KEY="mes-envies-v1";
let products=JSON.parse(localStorage.getItem(KEY)||"[]");
const $=id=>document.getElementById(id);
function pasteLink(){
  openForm();
  $("url").focus();
}
async function pasteFromClipboard(){
  try {
    const text = await navigator.clipboard.readText();

    if (!text || !/^https?:\/\//i.test(text.trim())) {
      alert("Le presse-papiers ne contient pas de lien valide.");
      return;
    }

    $("url").value = text.trim();
  } catch(e) {
    alert("Autorise l'accès au presse-papiers ou colle le lien manuellement.");
  }
}
async function getProductInfo(){
  const url = $("url").value.trim();

  if(!url){
    alert("Colle d'abord l'URL du produit.");
    return;
  }

  try {
    const response = await fetch(
      "https://api.microlink.io/?url=" + encodeURIComponent(url)
    );

    if(!response.ok) {
      throw new Error("Erreur API");
    }

    const result = await response.json();
    const data = result.data || {};

    const title = data.title || data.metadata?.title || "";
    const image = data.image?.url || data.metadata?.image?.url || "";

    let found = false;

    if(title) {
      $("name").value = title;
      found = true;
    }

    if(image) {
      $("image").value = image;
      found = true;
    }

    if(found) {
      alert("Informations récupérées !");
    } else {
      alert("Le site ne fournit pas d'informations récupérables automatiquement.");
    }

  } catch(error) {
    console.error(error);
    alert("Impossible de récupérer les informations de ce site.");
  }
}
function openForm(){dlg.showModal()}
function save(){
 const p={id:Date.now(),url:$("url").value.trim(),name:$("name").value.trim()||"Produit sans nom",
 price:Number($("price").value)||0,cat:$("cat").value,image:$("image").value.trim(),
 desc:$("desc").value.trim(),date:Date.now()};
 if(!p.url){alert("Ajoute au moins l'URL du produit.");return}
 products.unshift(p);localStorage.setItem(KEY,JSON.stringify(products));dlg.close();
 ["url","name","price","image","desc"].forEach(x=>$(x).value="");render();
}
function render(){
 const q=$("search").value.toLowerCase(), cat=$("catFilter").value, sort=$("sort").value;
 let a=products.filter(p=>(!cat||p.cat===cat)&&(!q||(p.name+" "+p.desc).toLowerCase().includes(q)));
 if(sort==="low")a.sort((x,y)=>x.price-y.price); if(sort==="high")a.sort((x,y)=>y.price-x.price);
 $("summary").textContent=`${products.length} produit${products.length>1?"s":""} · ${products.reduce((s,p)=>s+p.price,0).toFixed(2)} €`;
 $("list").innerHTML=a.length?a.map(p=>`<article class="card">
 ${p.image?`<img class="pic" src="${esc(p.image)}">`:`<div class="pic"></div>`}
 <div class="info"><div class="name">${esc(p.name)}</div><div class="price">${p.price.toFixed(2)} €</div>
 <div class="desc">${esc(p.desc||"Aucune description")}</div><span class="tag">${esc(p.cat)}</span>
 <div style="margin-top:9px"><a href="${esc(p.url)}" target="_blank"><button>Voir le produit</button></a>
 <button onclick="del(${p.id})" style="background:#eee;color:#111;margin-left:5px">Supprimer</button></div></div></article>`).join("")
 :`<div class="empty">Aucun produit.<br><br>Appuie sur <b>＋</b> pour ajouter ta première envie.</div>`;
 let cats=[...new Set(products.map(p=>p.cat))];$("catFilter").innerHTML='<option value="">Toutes les catégories</option>'+cats.map(c=>`<option>${esc(c)}</option>`).join("");
}
function del(id){products=products.filter(p=>p.id!==id);localStorage.setItem(KEY,JSON.stringify(products));render()}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
$("search").addEventListener("input",render);render();
</script>
 
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js");
  });
}
</script>
<nav class="ios-tabbar">
  <button class="tab active" onclick="window.scrollTo({top:0,behavior:'smooth'})">
    <span class="tab-icon">⌂</span>
    <span>Accueil</span>
  </button>

  <button class="tab" onclick="document.getElementById('search').focus()">
    <span class="tab-icon">⌕</span>
    <span>Rechercher</span>
  </button>

  <button class="tab add-tab" onclick="openForm()">
    <span class="add-circle">＋</span>
    <span>Ajouter</span>
  </button>

  <button class="tab" onclick="window.scrollTo({top:0,behavior:'smooth'})">
    <span class="tab-icon">♡</span>
    <span>Envies</span>
  </button>
</nav>
</body>
</html>
